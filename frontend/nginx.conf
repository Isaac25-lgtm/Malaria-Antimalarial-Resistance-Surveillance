# Static asset serving for the MARS web application.
#
# Client-side routing means any unknown path must fall back to index.html,
# otherwise a deep link such as /districts/304 returns 404 on a hard reload.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Surveillance content is not public and must not be indexed or embedded.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Hashed asset filenames are immutable; index.html must never be cached, or
    # a deploy would leave clients on a stale build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
