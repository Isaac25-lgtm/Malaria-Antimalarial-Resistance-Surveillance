name: CI

# Quality gates for MARS. Every job here must pass before a change is merged.
#
# The database job runs the integration suite against a real PostGIS container,
# which is the only place the audit-immutability trigger and the geography
# constraints can actually be exercised.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # -------------------------------------------------------------------------
  # The scientific boundary. Runs first and fast: a change that claims routine
  # data confirm resistance should fail before anything else is spent on it.
  # -------------------------------------------------------------------------
  terminology:
    name: Terminology lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check for prohibited resistance claims
        run: python scripts/terminology_lint.py

  # -------------------------------------------------------------------------
  # Backend
  # -------------------------------------------------------------------------
  backend:
    name: Backend lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Unit, API and security tests
        run: pytest -m "not integration" -q
        env:
          MARS_DATABASE_URL: postgresql+psycopg://mars:ci@localhost:5432/mars

      - name: Migrations render valid SQL offline
        # Proves both directions are executable without needing a database.
        run: |
          alembic upgrade head --sql > /dev/null
          alembic downgrade head:base --sql > /dev/null
        env:
          MARS_DATABASE_URL: postgresql+psycopg://mars:ci@localhost:5432/mars

  # -------------------------------------------------------------------------
  # Database integration
  # -------------------------------------------------------------------------
  database:
    name: PostgreSQL and PostGIS integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head
        env:
          MARS_DATABASE_URL: postgresql+psycopg://mars:ci@localhost:5432/mars_test

      - name: Verify migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head
        env:
          MARS_DATABASE_URL: postgresql+psycopg://mars:ci@localhost:5432/mars_test

      - name: Integration tests
        run: pytest -m integration -q
        env:
          MARS_DATABASE_URL: postgresql+psycopg://mars:ci@localhost:5432/mars_test
          MARS_TEST_DATABASE_URL: postgresql+psycopg://mars:ci@localhost:5432/mars_test

  # -------------------------------------------------------------------------
  # Contract drift
  #
  # The TypeScript client is generated from the API. If the two disagree the
  # interface breaks at run time instead of at build time, so this fails the
  # build rather than warning.
  # -------------------------------------------------------------------------
  contract:
    name: OpenAPI contract is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: pip install -e "./backend[dev]"

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Contract matches the API
        run: python scripts/export_openapi.py --check

      - name: Generated types match the contract
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts \
            || (echo "::error::Generated API types are stale. Run: npm run generate:api" && exit 1)
        working-directory: frontend

  # -------------------------------------------------------------------------
  # Frontend
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npx vite build

  # -------------------------------------------------------------------------
  # Supplied reference data
  # -------------------------------------------------------------------------
  geography:
    name: Geography manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Manifest is present and well formed
        # The boundary files themselves are excluded from Git by size, so CI
        # verifies the tracked manifest rather than the payload. A checkout that
        # does carry them gets a full checksum verification instead.
        run: |
          python - <<'PY'
          import json, pathlib, sys

          manifest = pathlib.Path("data/manifests/geography.sha256.json")
          if not manifest.exists():
              sys.exit("geography manifest is missing")

          document = json.loads(manifest.read_text(encoding="utf-8"))
          entries = document.get("files", [])
          expected = {
              "COUNTRY_BOUNDARY.json",
              "UGANDA_DISTRICT.json",
              "UGANDA_DISTRICTS.json",
              "UGANDA_SUBCOUNTIES.json",
          }
          recorded = {entry["filename"] for entry in entries}
          if recorded != expected:
              sys.exit(f"manifest covers {recorded}, expected {expected}")

          for entry in entries:
              if len(entry["sha256"]) != 64:
                  sys.exit(f"{entry['filename']}: malformed checksum")
              if entry["size_bytes"] <= 0:
                  sys.exit(f"{entry['filename']}: implausible size")

          print(f"geography manifest covers {len(entries)} files with valid checksums")
          PY

      - name: Verify checksums when the sources are present
        run: |
          if [ -f COUNTRY_BOUNDARY.json ]; then
            python scripts/geography_audit.py --verify-only
          else
            echo "Boundary sources are not in this checkout; manifest structure verified only."
          fi
