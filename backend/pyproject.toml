[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-backend"
version = "0.1.0"
description = "MARS - Malaria Antimalarial Resistance Surveillance. Backend API, analytics and worker services."
requires-python = ">=3.12"
license = { text = "Proprietary" }
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "geoalchemy2>=0.15,<0.18",
    "structlog>=24.4,<26",
    "redis>=5.0,<6",
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<0.29",
    # Direct dependency since Prompt 8: AES-256-GCM for the identity vault.
    # Present transitively via pyjwt[crypto], but a security primitive must be
    # declared where it is used rather than inherited from something else.
    "cryptography>=44,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.25",
    "ruff>=0.8,<0.13",
    "mypy>=1.13,<2",
    "types-redis>=4.6",
]

[project.scripts]
mars-api = "mars.main:run"
mars-worker = "mars.worker:run"
mars-import-geography = "mars.ingestion.geography.cli:run"
mars-import-encounters = "mars.ingestion.encounters.cli:run"
mars-demo-dataset = "mars.demo.cli:run"
mars-import-aggregate = "mars.ingestion.aggregate.cli:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mars*"]

# --------------------------------------------------------------------------
# Formatting and linting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "N818",  # exception naming - MarsError family is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["mars"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# Type checking
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/mars"]
plugins = ["pydantic.mypy"]
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mars.migrations.*"
ignore_errors = true

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL/PostGIS database (deselect with -m 'not integration')",
    "postgis: requires the PostGIS extension specifically",
]

[tool.coverage.run]
source = ["src/mars"]
omit = ["*/migrations/*"]
